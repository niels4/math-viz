<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fonts — Galleries Index</title>
    <style>
      :root {
        --bg: #0b0f1a;
        --panel: #111827;
        --line: #1e2e4a;
        --cyan: #00e5ff;
        --text: #d6eaff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-system, sans-serif;
      }
      header {
        padding: 22px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #0b1530 0%, var(--bg) 100%);
      }
      h1 {
        margin: 0;
        color: var(--cyan);
      }
      a {
        color: var(--cyan);
      }
      main {
        padding: 22px;
        max-width: 900px;
      }
      .card {
        border: 1px solid var(--line);
        background: #0f172a;
        padding: 14px;
        margin: 12px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>◈ FONTS — Galleries Index</h1>
      <div style="opacity: 0.7; font-size: 12px"><code>workspace/fonts/galleries/</code></div>
    </header>
    <main>
      <div class="card">
        <h2 style="color: var(--cyan); margin: 0">Main Gallery</h2>
        <p><a href="./gallery.html">gallery.html</a> — 23 fonts, filterable</p>
        <p><code>http://localhost:8787/fonts/galleries/gallery.html</code></p>
      </div>
    </main>
  </body>
</html>
